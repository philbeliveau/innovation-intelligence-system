architecture_notes: |
  Implementation demonstrates excellent architectural decisions:

  1. **Separation of Concerns**: Storage logic cleanly separated from Gradio UI
  2. **Error Handling**: Graceful degradation ensures pipeline never breaks
  3. **Validation**: Pydantic models enforce schema integrity before filesystem writes
  4. **Metadata Design**: Per-stage metadata enables future analytics without loading all examples
  5. **Integration Strategy**: Helper function provides simple integration point

  Storage structure follows the design specified in few-shot-algorithm-design.md
  with 7 stage folders (stage_0 through stage_6), each containing metadata.json
  for tracking example count, quality distribution, and usage statistics.

  The FileSystemExampleStorage class provides a clean abstraction that will
  support future enhancements in Story 11.3b (example selection algorithm)
  without requiring refactoring.

